name: Update TryHackMe Badge
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 
jobs:
  update-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Fetch and Update Badge
        uses: p4p1/tryhackme-badge-workflow@v1.0.0
        with:
          username: "omkarmarkad019-arch"
          image_path: "./assets/thm_propic.png"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
